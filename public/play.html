<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guess the Song</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="game">
<main>
  <div id="banner" role="status" hidden><span id="banner-text"></span><button type="button" id="retry-now">Retry now</button></div>
  <div id="error" role="alert" hidden></div>
  <div id="stage">
    <div id="app"><p>Connecting…</p></div>
    <div id="embed-note" role="status" hidden></div>
    <div id="embed-wrap" class="embed-hidden" aria-hidden="true" inert><h2>Now playing</h2><div id="embed"></div></div>
    <div id="app-foot"></div>
    <div id="app-side"></div>
  </div>
  <div id="live" class="sr-only" role="status" aria-live="polite"></div>
</main>
<script src="app.js"></script>
</body>
</html>

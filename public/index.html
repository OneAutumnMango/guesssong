<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guess the Song</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body class="home">
<main>
  <header>
    <h1>Guess the Song</h1>
    <p class="lede">Everyone brings their own music. Work out whose song is playing.</p>
  </header>
  <section id="resume" hidden>
    <h2>Your game</h2>
    <a class="btn" id="resume-link" href="/play.html">Rejoin game</a>
    <button type="button" class="secondary" id="forget">Forget this game</button>
  </section>
  <section>
    <h2>Host a game</h2>
    <a class="btn" href="/login?room=new">Create room</a>
  </section>
  <section>
    <h2>Join a game</h2>
    <form id="join">
      <label for="code">Room code</label>
      <input id="code" name="code" maxlength="4" autocomplete="off" autocapitalize="characters" required pattern="[A-Za-z]{4}">
      <button type="submit">Join</button>
    </form>
  </section>
</main>
<script>
document.getElementById('join').addEventListener('submit', (e) => {
  e.preventDefault();
  const code = document.getElementById('code').value.trim().toUpperCase();
  location.href = '/login?room=' + encodeURIComponent(code);
});
// saved seat from the last game (localStorage, 12 h)
try {
  const s = JSON.parse(localStorage.getItem('gs.seat'));
  if (s && typeof s.key === 'string' && Date.now() - s.savedAt < 12 * 3600 * 1000) {
    document.getElementById('resume-link').textContent = /^[A-Z]{4}$/.test(s.code) ? 'Rejoin game ' + s.code : 'Rejoin game';
    document.getElementById('resume').hidden = false;
    document.getElementById('forget').addEventListener('click', () => {
      try { localStorage.removeItem('gs.seat'); sessionStorage.removeItem('key'); } catch (e) { /* ignore */ }
      document.getElementById('resume').hidden = true;
    });
  } else if (s) localStorage.removeItem('gs.seat');
} catch (e) { /* storage blocked or bad data */ }
</script>
</body>
</html>

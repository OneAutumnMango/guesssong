# Release: git tag 0.1.0 && git push origin 0.1.0
# Only X.Y.Z integer tags (no "v" prefix) on a commit that is on main release. Builds and pushes
# ghcr.io/<owner>/<repo>:<tag> and :latest for linux/amd64 and linux/arm64.
# The repository name must be lowercase-safe (ghcr image names are lowercase).
name: Release image

on:
  push:
    tags:
      # Glob, not regex: "+" repeats the preceding char/range, "." is literal.
      # Only a first filter (it still lets through e.g. "01.2.3"); the
      # validate job below is the strict check.
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate tag is X.Y.Z
        env:
          TAG: ${{ github.ref_name }}
        run: |
          re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ "$TAG" =~ $re ]]; then
            echo "Tag '$TAG' is not a valid X.Y.Z release tag (integers, no leading zeros, no v prefix)" >&2
            exit 1
          fi
      # Full history so origin/main and the tagged commit's ancestry are available.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag '$GITHUB_REF_NAME' points at a commit that is not on main; release tags must be on main" >&2
            exit 1
          fi

  test:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
